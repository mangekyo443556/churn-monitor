# =============================================================================
# pyproject.toml — la "ficha técnica" del proyecto (Nivel 1)
#
# Lo lee Poetry. Aquí declaras:
#   1. Quién es el proyecto (nombre, versión, descripción)
#   2. Qué dependencias necesita para CORRER (tool.poetry.dependencies)
#   3. Qué dependencias necesita solo para DESARROLLAR (grupo dev)
#   4. La configuración de herramientas: pytest, mypy, coverage
#
# Regla de oro (igual que en pipeline-model-monitor):
#   - Este archivo es la LISTA DEL SÚPER (lo que pides).
#   - poetry.lock es el TICKET DE COMPRA (lo que realmente se instaló).
#   - Nunca edites poetry.lock a mano. Para subir una librería:
#       poetry update <paquete>   y commitea el lock.
# =============================================================================

[tool.poetry]
name = "churn-monitor"
version = "0.1.1"   # súbela en cada cambio (el deploy la usa como etiqueta)
description = "Mini monitor de drift para un modelo de churn. Proyecto de práctica que imita pipeline-model-monitor."
authors = ["ml.jhoan443556@gmail.com"]
readme = "README.md"
# package-mode = false: esto NO es una librería para publicar en PyPI,
# es una aplicación. Poetry solo gestiona sus dependencias.
package-mode = false

[tool.poetry.dependencies]
# Rango de Python aceptado. La Lambda corre 3.10, por eso es el mínimo.
python = ">=3.10,<3.13"
# Versiones EXACTAS para lo que va dentro de la imagen de Lambda.
# Lección del repo real: la imagen base (Amazon Linux 2) no puede instalar
# versiones nuevas que dejaron de publicar "wheels" compatibles.
pandas = "2.2.2"
numpy = "1.26.4"
scikit-learn = "1.5.2"
scipy = "1.13.1"
pyyaml = "^6.0"     # "^6.0" = cualquier 6.x, pero no 7.0
boto3 = "^1.34"

[tool.poetry.group.dev.dependencies]
# Solo para desarrollar y probar. NO se meten en la imagen de Lambda.
pytest = "^8.0"
pytest-cov = "^5.0"
mypy = "^1.11"
pandas-stubs = "~2.2.2"   # misma versión que pandas
types-PyYAML = "^6.0"
moto = {version = "^5.0", extras = ["s3"]}   # simula AWS en los tests

# -----------------------------------------------------------------------------
# Configuración de herramientas (no son dependencias, son ajustes)
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["."]          # para que "import commons" funcione en los tests
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "local_runs/*", "nivel0/*", "nivel7-paquete-privado/*"]

[tool.coverage.report]
fail_under = 70             # si la cobertura baja de 70 %, make test falla

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["nivel0/", "nivel7-paquete-privado/", "local_runs/"]

# Librerías que no traen anotaciones de tipos: mypy no las revisa.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "joblib.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
